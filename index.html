function fecharModalPanoramaCustom(){
  const overlay = document.getElementById('modal-pan-custom');
  if(overlay) overlay.remove();
}

function confirmarPanoramaCustom(){
  const ini = document.getElementById('pan-custom-ini').value;
  const fim = document.getElementById('pan-custom-fim').value;
  const erroEl = document.getElementById('pan-custom-erro');

  if(chaveOrdenavel(ini) > chaveOrdenavel(fim)){
    erroEl.textContent = 'O mês inicial não pode ser depois do mês final.';
    erroEl.style.display = 'block';
    return;
  }

  const meses = mesesCarregadosOrdenados().filter(m=>{
    const k = chaveOrdenavel(m);
    return k >= chaveOrdenavel(ini) && k <= chaveOrdenavel(fim);
  });

  if(!meses.length){
    erroEl.textContent = 'Nenhum mês nesta apresentação dentro desse intervalo.';
    erroEl.style.display = 'block';
    return;
  }

  fecharModalPanoramaCustom();
  abrirPanoramaCustom(meses);
}

function updateFooterPeriodo(){

  if(!el) return;
  if(PANORAMA_ACTIVE){
    const ord=['jan/26','fev/26','mar/26','abr/26','mai/26','jun/26','jul/26','ago/26','set/26','out/26','nov/26','dez/26'];
    const meses=ord.filter(m=>DB_OP[m]);
    el.textContent = meses.length
      ? 'Panorama Anual · '+meses.length+' mês(es) com dados: '+meses.map(m=>m.toUpperCase()).join(', ')
      : 'Panorama Anual · nenhum mês carregado ainda';
  } else if(PANORAMA_CUSTOM_ACTIVE){
    const meses=(PANORAMA_CUSTOM_MESES||[]);

      ? 'Panorama Personalizado · '+meses.length+' mês(es): '+meses.map(m=>m.toUpperCase()).join(', ')
      : 'Panorama Personalizado · nenhum mês selecionado';

    el.textContent = 'Período: '+(d&&d.mes||'—')+' · '+fmt(d&&d.total_os||0)+' OS registradas';

function mudarMes(mes){
  if(!DB_OP[mes]) return;
  // Guarda a aba atual antes de trocar o mês
  const abaAtual = document.querySelector('.content.active')?.id?.replace('tab-','');
  const vinhaDoPanorama = PANORAMA_ACTIVE || PANORAMA_CUSTOM_ACTIVE;
  CUR_MES=mes;

  // Selecionar um mês sempre SAI do Panorama (Anual ou Personalizado) e mostra a primeira aba disponível
  if(vinhaDoPanorama){
    PANORAMA_ACTIVE=false;
    PANORAMA_CUSTOM_ACTIVE=false;
    applyData(DB_OP[mes]);
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.content').forEach(c=>c.classList.remove('active'));
    const fid=primeiroTabId();
    const fidEl=document.getElementById('tab-'+fid); if(fidEl) fidEl.classList.add('active');
    const tabs=document.querySelectorAll('.tab'); if(tabs[0]) tabs[0].classList.add('active');
    const mt=document.getElementById('main-tabs'); if(mt) mt.style.display='flex';
    setTimeout(()=>drawAll(DB_OP[mes]),80);
    return;
  }

  applyData(DB_OP[mes]);
  // Mantém a aba que o usuário estava visualizando
  if(abaAtual && abaAtual!=='panorama'){
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.content').forEach(c=>c.classList.remove('active'));
    const idx=ACTIVE_TAB_IDS.indexOf(abaAtual);
    if(idx>=0){
      document.getElementById('tab-'+abaAtual).classList.add('active');
      document.querySelectorAll('.tab')[idx]?.classList.add('active');
    }
    if(abaAtual==='mapa') setTimeout(()=>drawMapa(DB_OP[mes]),90);
  }
}

function showTab(id,el){
  PANORAMA_ACTIVE=false;
  PANORAMA_CUSTOM_ACTIVE=false;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.content').forEach(c=>c.classList.remove('active'));
  document.getElementById('tab-'+id).classList.add('active');
  if(el) el.classList.add('active');
  renderMesesBar();
  updateFooterPeriodo();
  const mt=document.getElementById('main-tabs'); if(mt) mt.style.display='flex';
  if(CUR_DATA) setTimeout(()=>drawAll(CUR_DATA),60);
  if(id==='mapa' && CUR_DATA) setTimeout(()=>drawMapa(CUR_DATA),90);
}

  if(PANORAMA_ACTIVE){
    fecharPanorama();
    return;

  PANORAMA_ACTIVE=true;
  PANORAMA_CUSTOM_ACTIVE=false;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.content').forEach(c=>c.classList.remove('active'));

function showTabById(id){

// ══════════════════════════════════════════════
//  EXPORTAR PDF TRIMESTRAL — uma página por mês
//  (captura a aba atualmente em tela para cada mês do trimestre)
// ══════════════════════════════════════════════
async function exportarPDFTrimestral(mesesAlvo){
  mesesAlvo = mesesAlvo || ['mai/26','jun/26','jul/26'];
  if(!window.jspdf || !window.jspdf.jsPDF){ alert('Biblioteca PDF não carregou. Recarregue a página (F5).'); return; }
  if(!window.html2canvas){ alert('Biblioteca de captura não carregou. Recarregue a página (F5).'); return; }

  const disponiveis = mesesAlvo.filter(m=>!!DB_OP[m]);
  const faltando = mesesAlvo.filter(m=>!DB_OP[m]);
  if(disponiveis.length===0){ alert('Nenhum dos meses do trimestre ('+mesesAlvo.join(', ').toUpperCase()+') está disponível nesta apresentação.'); return; }
  if(faltando.length>0){
    if(!confirm('Os meses '+faltando.join(', ').toUpperCase()+' não estão disponíveis nesta apresentação e serão pulados. Continuar mesmo assim?')) return;
  }

  const btn = document.getElementById('btn-export-pdf-trimestral');
  const originalLabel = btn ? btn.textContent : null;
  const mesOriginal = CUR_MES;
  const abaOriginal = document.querySelector('.content.active')?.id?.replace('tab-','');

  if(btn){ btn.disabled = true; }

  const jsPDFCtor = window.jspdf.jsPDF;
  const doc = new jsPDFCtor({unit:'pt', format:'a4', orientation:'portrait'});
  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();
  const margin = 24;
  const availableW = pageW - margin*2;

  try{
    for(let i=0; i<disponiveis.length; i++){
      const mes = disponiveis[i];
      if(btn) btn.textContent = '⏳ '+mes.toUpperCase()+'…';
      mudarMes(mes);
      await new Promise(r=>setTimeout(r,250)); // aguarda renderização/gráficos do mês

      const area = document.querySelector('.content.active') || document.getElementById('tabs-content-wrapper');
      const canvas = await html2canvas(area, {scale:2, backgroundColor:'#ffffff', useCORS:true});

      if(i>0) doc.addPage();

      doc.setFont('helvetica','bold'); doc.setFontSize(14); doc.setTextColor(26,37,53);
      doc.text('Trimestral — '+mes.toUpperCase(), margin, margin+4);
      const yStart = margin + 22;
      const availableH = pageH - yStart - margin;

      // Escala única (largura E altura) para o conteúdo inteiro do mês caber em UMA página
      const scaleFactor = Math.max(canvas.width/availableW, canvas.height/availableH);
      const finalW = canvas.width/scaleFactor;
      const finalH = canvas.height/scaleFactor;
      const xPos = margin + (availableW-finalW)/2; // centraliza horizontalmente

      doc.addImage(canvas.toDataURL('image/png'), 'PNG', xPos, yStart, finalW, finalH);
    }

    doc.save('Trimestral_'+disponiveis.map(m=>m.replace('/','')).join('-')+'.pdf');
  } catch(e){
    alert('Erro ao gerar PDF: '+e.message);
  } finally {
    if(mesOriginal) mudarMes(mesOriginal);
    if(abaOriginal) setTimeout(()=>showTabById(abaOriginal),60);
    if(btn){ btn.disabled = false; btn.textContent = originalLabel; }
  }
}

window.addEventListener('load',function(){
  const cfgMeses = EXPORT_CONFIG.meses || {};
  Object.keys(cfgMeses).forEach(m=>{ DB_OP[m] = migrateData(cfgMeses[m]); });

  ACTIVE_TAB_IDS = TAB_DEFS.filter(t=>(EXPORT_CONFIG.tabs||[]).includes(t.id)).map(t=>t.id);
  INCLUDE_PANORAMA = (EXPORT_CONFIG.tabs||[]).includes('panorama');
  INCLUDE_PANORAMA_CUSTOM = (EXPORT_CONFIG.tabs||[]).includes('panorama_custom');

  buildTabsUI();

  const keys = ALL_MESES.filter(m=>DB_OP[m]);
  if(!keys.length){
    document.getElementById('dash-wrapper').innerHTML =
      '<div style="padding:80px 20px;text-align:center;color:#5a6e82;font-family:\'Barlow Condensed\',sans-serif">'+
      '<div style="font-size:2.5rem;margin-bottom:14px">📭</div>'+
      '<div style="font-size:1.3rem;font-weight:700">Nenhum dado disponível nesta apresentação.</div>'+
      '</div>';
    return;
  }

  CUR_MES = keys[keys.length-1];

  if(EXPORT_CONFIG.titulo){
    const b=document.querySelector('.h-brand'); if(b) b.innerHTML = EXPORT_CONFIG.titulo;
  }
  if(EXPORT_CONFIG.subtitulo){
    const s=document.querySelector('.h-sub'); if(s) s.textContent = EXPORT_CONFIG.subtitulo;
  }
  const upd=document.getElementById('tb-upd');
  if(upd) upd.textContent = EXPORT_CONFIG.geradoEm ? ('✓ Apresentação gerada em '+EXPORT_CONFIG.geradoEm) : '';

  applyData(DB_OP[CUR_MES]);
});
window.addEventListener('resize',()=>{ if(CUR_DATA) drawAll(CUR_DATA); });
